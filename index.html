<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO -->
    <title>Brian Muchiru | Software Engineer</title>

    <meta
      name="description"
      content="Brian Muchiru is a Software Engineer passionate about building modern, responsive and user-friendly web applications using React, JavaScript, Java and Tailwind CSS."
    />

    <meta
      name="keywords"
      content="Brian Muchiru, Software Engineer, React Developer, Frontend Developer, Java Developer, Tailwind CSS, JavaScript, Portfolio"
    />

    <meta
      name="author"
      content="Brian Muchiru"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#020617"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Brian Muchiru | Software Engineer"
    />

    <meta
      property="og:description"
      content="Explore my portfolio featuring modern web applications built with React, JavaScript, Java, Tailwind CSS and more."
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <meta
      property="og:url"
      content="https://brianmuchiruportfolio.netlify.app"
    />

    <meta
      property="og:site_name"
      content="Brian Muchiru Portfolio"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Brian Muchiru | Software Engineer"
    />

    <meta
      name="twitter:description"
      content="Modern Software Engineer Portfolio built with React and Tailwind CSS."
    />

    <meta
      name="twitter:image"
      content="/og-image.png"
    />

    <!-- Mobile -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://brianmuchiruportfolio.netlify.app"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
